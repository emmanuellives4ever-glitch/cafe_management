<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}The Bake House {% endblock %}</title>
        <link rel="stylesheet" href="static/style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
        
    </head>
    <body class="d-flex flex-column min-vh-100">
        <nav class="navbar bg-light sticky-top" data-bs-theme="light">
            <div class="container-fluid">
                <a class="navbar-brand d-flex align-items-center brand-text" href="{{ url_for('index')}}">
                    <img src="{{ url_for('static', filename='images/cafe.jpg') }}"
                    alt="Logo" width="30" height="24" class="brand-logo me-2">
                    Bake House
                    
                </a>
                <div class="ms-auto d-flex align-items-center gap-3">
                        <a class="btn btn-sm btn-success" href="{{url_for('login')}}">Login</a>
                        <a class="btn btn-sm btn-secondary" href="{{url_for('register')}}">Register</a>
                    
        </div>
            </div>
        </nav>

       {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="container mt-3">
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        </div>
        {% endif %}
        {%endwith%}

        {% block content %}
        {% endblock %}

        <footer class="bg-light py-3  mt-4">
            <div class="container text-center">
                <p class="mb-0">&copy; 2026 The Bake House. All rights reserved.</p>
            </div>
        </footer>
    </body>
    
</html>
